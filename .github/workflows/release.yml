name: Release Liberty Chat

# Manual only. Tag pushes no longer trigger a build — run this from the Actions
# tab (Actions -> Release Liberty Chat -> Run workflow) when you want to cut a
# signed release. Builds only the no-Sentry / Python-backend variant (4 APKs).
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, no leading v (e.g. 1.0.0)"
        required: true
        default: "2.0.7"

permissions:
  contents: write # create the release + tag and upload assets

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # full history so the Gradle version-from-tag logic works

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.3.0
        with:
          cache-read-only: false

      - name: Resolve version
        id: version
        run: |
          VERSION="${{ inputs.version }}"
          VERSION="${VERSION#v}" # tolerate a leading v
          TAG_NAME="v${VERSION}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "dl=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${TAG_NAME}" >> "$GITHUB_OUTPUT"
          # Tag this commit locally so getVersionFromTag() in app/build.gradle.kts
          # reports the exact version (the About screen reads it). Force in case a
          # tag of the same name was fetched from the remote at an older commit.
          git tag -f "$TAG_NAME"
          echo "Building Liberty Chat $VERSION"

      - name: Collect changes since the previous release
        id: changelog
        run: |
          # The previous LCS release tag, excluding the one just created here.
          #
          # Upstream Columba tags (v2.0.9, v1.4.x, ...) are genuinely in this
          # history because the branch merges upstream, and their numbering
          # overlaps ours — v2.0.9 sorts above our v2.0.4 and would be picked as
          # the baseline, producing a release body listing months of unrelated
          # upstream work. Version sorting alone cannot separate them, so match
          # on the tagged commit's author instead: LCS releases are tagged on
          # daylight-hub commits, upstream's on torlando-tech ones.
          PREV_TAG=""
          for CANDIDATE in $(git tag --merged HEAD --sort=-v:refname \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | grep -v "^${{ steps.version.outputs.tag }}$"); do
            AUTHOR="$(git log -1 --format='%an' "$CANDIDATE" 2>/dev/null)"
            if [ "$AUTHOR" = "daylight-hub" ]; then
              PREV_TAG="$CANDIDATE"
              break
            fi
          done

          if [ -z "$PREV_TAG" ]; then
            echo "No previous release tag found; listing the last 20 commits."
            RANGE="-20"
          else
            echo "Previous release: $PREV_TAG"
            RANGE="${PREV_TAG}..HEAD"
          fi

          # Subject lines only, merge commits dropped (they restate their branch
          # name and read as noise in a release body).
          {
            echo "changes<<CHANGELOG_EOF"
            git log --no-merges --pretty=format:'- %s' $RANGE
            echo ""
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"
          echo "prev=$PREV_TAG" >> "$GITHUB_OUTPUT"

      - name: Build Release APK (no-Sentry, Python backend)
        timeout-minutes: 40
        env:
          KEYSTORE_FILE: ${{ secrets.KEYSTORE_FILE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleNoSentryPythonBackendRelease --no-daemon --stacktrace
          echo "✓ Release APKs built"

      - name: Build Release AAB (Play Store)
        # Reuses compiled classes/resources from the assemble step above, so
        # this is fast (~1m) despite the multi-flavor project. Only the
        # pythonBackend flavor is built: it's the appId (network.libertychat.app)
        # registered with the Play Console listing — kotlinBackend (`.kt`
        # suffix) isn't published there.
        timeout-minutes: 15
        env:
          KEYSTORE_FILE: ${{ secrets.KEYSTORE_FILE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
        run: |
          ./gradlew :app:bundleSentryPythonBackendRelease --no-daemon --stacktrace
          echo "✓ Release AAB built successfully"

      - name: Extract signing certificate fingerprints
        id: cert
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          CERT_INFO=$(keytool -list -v -keystore app/build/keystore/release.keystore \
            -alias "$KEY_ALIAS" -storepass "$KEYSTORE_PASSWORD")
          SHA256=$(echo "$CERT_INFO" | grep "SHA256:" | awk '{print $2}')
          SHA1=$(echo "$CERT_INFO" | grep "SHA1:" | awk '{print $2}')
          if [ -z "$SHA256" ] || [ -z "$SHA1" ]; then
            echo "::error::Failed to extract certificate fingerprints — are the KEYSTORE_* secrets set?"
            exit 1
          fi
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "sha1=$SHA1" >> "$GITHUB_OUTPUT"

      - name: Rename APKs
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          DIR="app/build/outputs/apk/noSentryPythonBackend/release"
          for apk in "$DIR"/*.apk; do
            [ -e "$apk" ] || continue
            f=$(basename "$apk")
            case "$f" in
              *armeabi-v7a*) cp "$apk" "libertychat-${VERSION}-official-rns-py-armeabi-v7a.apk" ;;
              *arm64-v8a*)   cp "$apk" "libertychat-${VERSION}-official-rns-py-arm64-v8a.apk" ;;
              *x86_64*)      cp "$apk" "libertychat-${VERSION}-official-rns-py-x86_64.apk" ;;
              *universal*)   cp "$apk" "libertychat-${VERSION}-official-rns-py-universal.apk" ;;
            esac
          done
          ls -la libertychat-*.apk
          echo "✓ Renamed APKs"

      - name: Rename AAB with version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cp app/build/outputs/bundle/sentryPythonBackendRelease/app-sentry-pythonBackend-release.aab \
            "libertychat-${VERSION}-official-rns-py.aab"
          sha256sum "libertychat-${VERSION}-official-rns-py.aab" > "libertychat-${VERSION}-official-rns-py.aab.sha256"
          echo "✓ Renamed AAB"

      - name: Generate SHA256 checksums
        run: |
          for apk in libertychat-*.apk; do sha256sum "$apk" > "${apk}.sha256"; done

      - name: Read SHA256 checksums
        id: sha256
        run: |
          echo "checksums<<EOF" >> "$GITHUB_OUTPUT"
          cat libertychat-*.apk.sha256 >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Liberty Chat ${{ steps.version.outputs.version }}
          # The .aab isn't linked from the body below (users can't sideload
          # it — it's Play Console upload material only) but still rides
          # along as a release asset: those don't count against Actions
          # storage quota the way workflow artifacts do.
          files: |
            libertychat-*.apk
            libertychat-*.apk.sha256
            libertychat-*.aab
          draft: true
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
          body: |
            ## Liberty Chat ${{ steps.version.outputs.version }}

            Messaging and voice over LXMF / Reticulum (Bluetooth LE, TCP, or RNode
            LoRa), distributed by Liberty Communication Systems, Inc. Built on
            Columba (MPL 2.0).

            ### What's new since ${{ steps.changelog.outputs.prev }}
            <!-- Generated from the commits since the previous release tag.
                 Trim this to the user-visible changes before publishing. -->
            ${{ steps.changelog.outputs.changes }}

            ### Installation
            Download the APK matching your phone's CPU. Most modern phones are
            **arm64-v8a**; if unsure, use **universal**.

            #### Python backend (`official-rns-py`)
            | APK | Architecture | Devices |
            |-----|-------------|---------|
            | [`libertychat-${{ steps.version.outputs.version }}-official-rns-py-arm64-v8a.apk`](${{ steps.version.outputs.dl }}/libertychat-${{ steps.version.outputs.version }}-official-rns-py-arm64-v8a.apk) | arm64-v8a | Most modern Android phones & tablets |
            | [`libertychat-${{ steps.version.outputs.version }}-official-rns-py-armeabi-v7a.apk`](${{ steps.version.outputs.dl }}/libertychat-${{ steps.version.outputs.version }}-official-rns-py-armeabi-v7a.apk) | armeabi-v7a | Older 32-bit ARM devices |
            | [`libertychat-${{ steps.version.outputs.version }}-official-rns-py-x86_64.apk`](${{ steps.version.outputs.dl }}/libertychat-${{ steps.version.outputs.version }}-official-rns-py-x86_64.apk) | x86_64 | Chromebooks, emulators, some tablets |
            | [`libertychat-${{ steps.version.outputs.version }}-official-rns-py-universal.apk`](${{ steps.version.outputs.dl }}/libertychat-${{ steps.version.outputs.version }}-official-rns-py-universal.apk) | All | Universal fallback (larger download) |

            ### Verification
            **Signing certificate fingerprints:**
            ```
            SHA-256: ${{ steps.cert.outputs.sha256 }}
            SHA-1:   ${{ steps.cert.outputs.sha1 }}
            ```

            **SHA256 checksums:**
            ```
            ${{ steps.sha256.outputs.checksums }}
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APKs as workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: liberty-chat-${{ steps.version.outputs.version }}-apks
          path: libertychat-*.apk
          retention-days: 1
