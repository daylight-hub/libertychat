# Liberty Chat (LCS) — manual APK build.
#
# This adds a "Run workflow" button under the repository's Actions tab that
# builds ONLY the no-Sentry / Python-backend (official-rns-py) variant and
# publishes exactly four APKs:
#
#   libertychat-<version>-official-rns-py-armeabi-v7a.apk
#   libertychat-<version>-official-rns-py-arm64-v8a.apk
#   libertychat-<version>-official-rns-py-x86_64.apk
#   libertychat-<version>-official-rns-py-universal.apk
#
# Every APK here is a no-Sentry build, so the redundant "-no-sentry" suffix is
# dropped and the plain official-rns-py names are used (matching the requested
# filenames). Nothing else is built — no Sentry variants, no Kotlin backend.
name: Build Liberty Chat APKs

on:
  workflow_dispatch:
    inputs:
      version_override:
        description: "Version string for the APK filenames (blank = exact tag on this commit, else 1.0.0)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # full history so version-from-tag works

      - name: Set up Python (Chaquopy runtime for the Python backend)
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Resolve version
        id: version
        run: |
          if [ -n "${{ inputs.version_override }}" ]; then
            VERSION="${{ inputs.version_override }}"
          else
            # Prefer an exact tag on the release commit (e.g. v1.0.0). Fall back to the
            # first-release version rather than the upstream ancestor tag (v2.0.9).
            VERSION="$(git describe --tags --exact-match 2>/dev/null | sed 's/^v//')"
            [ -z "$VERSION" ] && VERSION="2.0.7"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building Liberty Chat APKs for version $VERSION"

      - name: Assemble no-Sentry / Python-backend release
        env:
          # Optional signing — only used if these repo secrets are set.
          KEYSTORE_FILE: ${{ secrets.KEYSTORE_FILE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon :app:assembleNoSentryPythonBackendRelease

      - name: Collect and rename the four APKs
        id: collect
        run: |
          set -e
          VERSION="${{ steps.version.outputs.version }}"
          OUT="app/build/outputs/apk/noSentryPythonBackend/release"
          DEST="liberty-chat-apks"
          mkdir -p "$DEST"

          rename() { # $1 = abi token in source name, $2 = target abi token
            for apk in "$OUT"/*.apk; do
              [ -e "$apk" ] || continue
              case "$(basename "$apk")" in
                *"$1"*)
                  cp "$apk" "$DEST/libertychat-${VERSION}-official-rns-py-${2}.apk"
                  echo "  $(basename "$apk")  ->  libertychat-${VERSION}-official-rns-py-${2}.apk"
                  ;;
              esac
            done
          }

          echo "Source APKs:"
          ls -la "$OUT"/*.apk || { echo "No APKs produced"; exit 1; }

          rename "armeabi-v7a" "armeabi-v7a"
          rename "arm64-v8a"   "arm64-v8a"
          rename "x86_64"      "x86_64"
          rename "universal"   "universal"

          echo "Final artifacts:"
          ls -la "$DEST"

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: liberty-chat-${{ steps.version.outputs.version }}-official-rns-py-apks
          path: liberty-chat-apks/*.apk
          if-no-files-found: error
